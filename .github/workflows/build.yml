name: Build & Release Typhon

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Rebuild Solution (Release)
      run: msbuild Typhon.sln /t:Rebuild /p:Configuration=Release /p:Platform="x86"

    - name: Package Executable into Zip
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path ./publish -Force
        Copy-Item ./src/bin/Release/Typhon.exe ./publish/Typhon.exe
        if (Test-Path ./src/bin/Release/Typhon.exe.config) {
          Copy-Item ./src/bin/Release/Typhon.exe.config ./publish/Typhon.exe.config
        }
        Compress-Archive -Path ./publish/* -DestinationPath ./Typhon-Release.zip -Force

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Typhon-Release
        path: Typhon-Release.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          Typhon-Release.zip
          ./publish/Typhon.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
